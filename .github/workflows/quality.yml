name: Local quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-local-password
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://forge:forge-local-password@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run quality
